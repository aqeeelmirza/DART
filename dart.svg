<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- board -->
  <circle cx="120" cy="124" r="104" fill="#1f1f1f"/>
  <circle cx="120" cy="124" r="96"  fill="#f3eadb"/>
  <circle cx="120" cy="124" r="78"  fill="#c62828"/>
  <circle cx="120" cy="124" r="60"  fill="#f3eadb"/>
  <circle cx="120" cy="124" r="42"  fill="#2e7d32"/>
  <circle cx="120" cy="124" r="24"  fill="#f3eadb"/>
  <circle cx="120" cy="124" r="11"  fill="#c62828"/>
  <!-- sector lines -->
  <g stroke="#1f1f1f" stroke-width="1.2" opacity="0.35">
    <line x1="120" y1="28" x2="120" y2="220"/>
    <line x1="24" y1="124" x2="216" y2="124"/>
    <line x1="52" y1="56" x2="188" y2="192"/>
    <line x1="188" y1="56" x2="52" y2="192"/>
  </g>
  <!-- dart: shaft from upper-right into the bullseye -->
  <g transform="translate(120 124) rotate(-35)">
    <!-- tip -->
    <polygon points="0,0 14,-2.5 14,2.5" fill="#9e9e9e"/>
    <!-- barrel -->
    <rect x="14" y="-4" width="34" height="8" rx="3" fill="#455a64"/>
    <!-- shaft -->
    <rect x="48" y="-2.5" width="38" height="5" rx="2" fill="#78909c"/>
    <!-- flights -->
    <polygon points="86,0 118,-18 112,0 118,18" fill="#1e88e5"/>
    <polygon points="86,0 112,0 118,-18" fill="#42a5f5"/>
  </g>
</svg>
